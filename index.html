<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>MiC Crane Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a site-plan sheet on top, crane palette + live check below, like a drawing with its schedule */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --site:#ECEAE4; --band:#E1E3DE; --spine:#E8E9E4;
  --ink:#1D2830; --muted:#5A6670; --line:#C8CDCB; --line-strong:#8C969C;
  --std:#D4E3F2; --std-edge:#7F9DBE; --heavy:#EBA06C; --heavy-edge:#B8581F;
  --c14:#2B5D91; --c14l:#1F7A7C; --c20:#C2571A;
  --ok:#2E7D4F; --bad:#C0392B; --warn:#B7791F; --focus:#2B5D91;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"PingFang HK","Microsoft JhengHei","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181C; --surface:#192127; --site:#1C242A; --band:#232D34; --spine:#20292F;
  --ink:#E4E9EC; --muted:#99A5AE; --line:#33404A; --line-strong:#5E6B75;
  --std:#2A3E53; --std-edge:#6F92B8; --heavy:#7C4627; --heavy-edge:#E58A4F;
  --c14:#74A6DC; --c14l:#5DB8B8; --c20:#EE8C4E;
  --ok:#5CC08A; --bad:#F07167; --warn:#E3B04B; --focus:#74A6DC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181C; --surface:#192127; --site:#1C242A; --band:#232D34; --spine:#20292F;
  --ink:#E4E9EC; --muted:#99A5AE; --line:#33404A; --line-strong:#5E6B75;
  --std:#2A3E53; --std-edge:#6F92B8; --heavy:#7C4627; --heavy-edge:#E58A4F;
  --c14:#74A6DC; --c14l:#5DB8B8; --c20:#EE8C4E;
  --ok:#5CC08A; --bad:#F07167; --warn:#E3B04B; --focus:#74A6DC; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:.01em;text-wrap:balance}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.02em}
.head-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.tabs button+button{border-left:1px solid var(--line-strong)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button:disabled{color:var(--muted);cursor:not-allowed}
button:focus-visible,[data-slot]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ghost{border:1px solid var(--line-strong);background:transparent;color:var(--ink);font:500 14px var(--f-body);padding:7px 12px;border-radius:6px;cursor:pointer}
.ghost:hover{background:var(--band)}
.brief{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px 28px;align-items:start}
.brief p{margin:0;max-width:62ch}
.brief ol{margin:0;padding-left:1.3em;color:var(--muted);font-size:14px}
.brief ol li+li{margin-top:2px}
.brief strong{color:var(--ink)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.plan-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#plan{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
#plan text{font-family:var(--f-mono)}
[data-slot]{cursor:pointer;outline:none}
[data-slot]:hover .hit{fill:var(--ink);fill-opacity:.07}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 4px 2px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:16px;height:12px;border-radius:2px;border:1px solid;display:inline-block}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.palette{display:flex;flex-direction:column;gap:8px}
.ctype{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:10px 12px;cursor:pointer;font:inherit}
.ctype:hover{border-color:var(--line-strong)}
.ctype[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ctype:disabled{opacity:.45;cursor:not-allowed}
.ctype .nm{font-weight:600}
.ctype .sub{display:block;font-size:12.5px;color:var(--muted)}
.ctype .cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.hint{margin:0;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:6px;border:1px solid var(--line)}
.verdict .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.verdict b{display:block;font-size:16px}
.verdict.ok{border-color:var(--ok)} .verdict.ok .dot{background:var(--ok)}
.verdict.no .dot{background:var(--bad)}
.issues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.issues li{display:flex;gap:8px;align-items:baseline}
.issues .tag{font-family:var(--f-mono);font-size:12px;padding:1px 6px;border-radius:3px;border:1px solid;flex:none}
.tag.bad{color:var(--bad);border-color:var(--bad)} .tag.warn{color:var(--warn);border-color:var(--warn)} .tag.info{color:var(--muted);border-color:var(--line-strong)}
.primary{border:0;background:var(--ink);color:var(--bg);font:600 14px var(--f-body);padding:9px 14px;border-radius:6px;cursor:pointer;align-self:flex-start}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.breakdown{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.breakdown span:nth-child(even){text-align:right;color:var(--ink)}
.loads{display:flex;flex-direction:column;gap:7px}
.load{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 4.2em;gap:10px;align-items:center;font-size:13px}
.load .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load .bar{height:10px;background:var(--band);border-radius:2px;overflow:hidden;display:flex}
.load .bar i{display:block;height:100%}
.load .d{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.load.idle .lb,.load.idle .d{color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
tr.best td{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill{font-family:var(--f-mono);font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:3px;padding:0 5px;margin-left:6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin-top:12px}
.params fieldset{border:1px solid var(--line);border-radius:6px;padding:8px 12px 10px;margin:0;display:flex;flex-direction:column;gap:6px}
.params legend{font-size:13px;color:var(--muted);padding:0 4px}
.params label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.params input{width:6em;font:500 14px var(--f-mono);padding:4px 6px;border:1px solid var(--line-strong);border-radius:4px;background:var(--bg);color:var(--ink);text-align:right}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.toast{min-height:1.4em;font-size:13px;color:var(--warn);margin:0}
@media (max-width:820px){.panels,.brief{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.load .bar i{transition:width .25s ease}}
</style>
<style>
.save{display:flex;flex-direction:column;gap:12px}
.save table td.n b{font-size:16px}
.save .bars{display:flex;flex-direction:column;gap:8px}
.save .brow{display:grid;grid-template-columns:4.2em minmax(0,1fr) 7.6em;gap:10px;align-items:center;font-size:13.5px}
.save .bar{height:14px;background:var(--band);border-radius:2px;overflow:hidden;display:flex}
.save .bar i{display:block;height:100%}
.save .amt{font-family:var(--f-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.lock{border:1px dashed var(--line-strong);border-radius:6px;padding:14px;color:var(--muted);font-size:14px;margin:0}
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="h1"></h1>
    </div>
    <div class="head-ctl">
      <div class="tabs" role="tablist">
        <button id="tab1" role="tab"></button>
        <button id="tab2" role="tab"></button>
      </div>
      <button class="ghost" id="lang"></button>
    </div>
  </header>

  <div class="brief" id="brief"></div>

  <section class="sheet">
    <div class="plan-scroll"><svg id="plan" viewBox="180 62 780 370" role="img"></svg></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panels">
    <div class="panel">
      <h2 id="h-cranes"></h2>
      <div class="palette" id="palette"></div>
      <p class="hint" id="hint"></p>
      <p class="toast" id="toast" aria-live="polite"></p>
      <div class="row"><button class="ghost" id="clear"></button></div>
    </div>
    <div class="panel" id="status" aria-live="polite"></div>
  </section>

  <details id="params-box">
    <summary id="h-params"></summary>
    <div class="params" id="params"></div>
    <p class="note" id="params-note"></p>
  </details>
</div>

<script>
(function(){
const T = {
 en:{
  eyebrow:"MiC Construction Planning & Management", h1:"Tower Crane Planner",
  tab1:"Level 1 · Make it buildable", tab2:"Level 2 · Cut the cost", lang:"繁體中文", htmlLang:"en",
  b1:"The site and all 32 modules are already fixed. You have <strong>three 14 t cranes</strong> and <strong>one 20 t crane</strong>. Put each crane on a marked position (A–N) so every module can be lifted.",
  b2:"This time you only have <strong>two 14 t cranes</strong> and <strong>one 20 t crane</strong>, one crane fewer. Find positions that still let every module be lifted, then see how much you save.",
  r1:"A crane can lift a module only if the <strong>whole module</strong> sits inside its circle.",
  r2:"Orange modules weigh 14–20 t. Only a <strong>20 t crane</strong> can lift them.",
  r3:"Cranes stand on the marked positions only.",
  r4:"One crane fewer means no erection and dismantling cost and no monthly rent for that crane.",
  cranes:"Cranes", hint:"Pick a crane type, then tap a position on the plan. Tap a placed crane to remove it.",
  clear:"Remove all cranes",
  S:"14 t crane", Ssub:"Standard modules only",
  L:"20 t crane", Lsub:"Heavy and standard modules",
  left:n=>`${n} left`, sep:", ",
  lgStd:"Standard module ≤ 14 t", lgHeavy:"Heavy module 14–20 t", lgNone:"No crane can reach it", lgCap:"Only a 14 t crane reaches it",
  okTitle:"Buildable: every module can be lifted.", okSub:"All 32 modules are inside a crane that is strong enough.",
  noTitle:"Not buildable yet.",
  iNone:n=>`${n} module${n>1?"s are":" is"} outside every crane circle.`,
  iCap:n=>`${n} heavy module${n>1?"s are":" is"} only reached by a 14 t crane, which is too weak.`,
  iLeft:s=>`Still to place: ${s}.`,
  iIdle:s=>`${s} lifts nothing. Can you move it somewhere more useful?`,
  next:"Go to Level 2",
  saveH:"Saving from one fewer 14 t crane",
  saveLock:"Place the two 14 t cranes and the 20 t crane so the project is buildable. The saving appears here.",
  formula:(a,b)=>`Saving = erection & dismantling ${a} + rent ${b} × months.`,
  dur:"Project length", setup:"Erection & dismantling", rent:"Rent", total:"Total saving",
  m:n=>`${n} month${n>1?"s":""}`,
  saveNote:"The erection and dismantling cost is saved once. The rent saving grows every month the project runs.",
  params:"Teacher settings: 14 t crane cost", pRent:"Rent per month, incl. operator (HK$)", pSetup:"Erection & dismantling, one-off (HK$)",
  pNote:"Illustrative teaching values, not market quotes. Changes update the saving immediately.",
  noneLeft:t=>`No ${t} left. Tap a placed crane to move it.`,
  site:"SITE BOUNDARY", core:"CORE", north:"NORTH WING", south:"SOUTH WING", east:"EAST END",
  plan:"Site plan with module layout, crane positions and crane coverage"
 },
 zh:{
  eyebrow:"MiC 施工規劃與管理", h1:"塔吊佈置模擬器",
  tab1:"第 1 關 · 令項目起得成", tab2:"第 2 關 · 慳成本", lang:"English", htmlLang:"zh-HK",
  b1:"地盤同 32 個組件嘅位置已經定咗。你有 <strong>3 部 14 t 塔吊</strong>同 <strong>1 部 20 t 塔吊</strong>，將每部塔吊擺喺標示咗嘅位置（A–N），令所有組件都吊得到。",
  b2:"今次得 <strong>2 部 14 t 塔吊</strong>同 <strong>1 部 20 t 塔吊</strong>，少咗一部。試吓搵出擺法，令所有組件照樣吊得到，再睇吓慳到幾多錢。",
  r1:"成個組件都要喺塔吊嘅覆蓋圈入面，嗰部塔吊先吊得到佢。",
  r2:"橙色組件重 14–20 t，淨係 <strong>20 t 塔吊</strong>先吊得郁。",
  r3:"塔吊只可以擺喺標示咗嘅位置。",
  r4:"少用一部塔吊，就慳返嗰部塔吊嘅安裝拆卸費同每個月嘅租金。",
  cranes:"塔吊", hint:"先揀一款塔吊，再撳平面圖上面嘅標示點。撳返已經擺咗嘅塔吊就可以移走佢。",
  clear:"移走全部塔吊",
  S:"14 t 塔吊", Ssub:"淨係吊得標準組件",
  L:"20 t 塔吊", Lsub:"重組件同標準組件都吊得",
  left:n=>`仲有 ${n} 部`, sep:"、",
  lgStd:"標準組件 ≤ 14 t", lgHeavy:"重組件 14–20 t", lgNone:"冇塔吊夠得到", lgCap:"得 14 t 塔吊夠得到",
  okTitle:"起得成：所有組件都吊得到。", okSub:"32 個組件都喺一部夠力嘅塔吊範圍入面。",
  noTitle:"仲未起得成。",
  iNone:n=>`有 ${n} 個組件唔喺任何塔吊嘅覆蓋圈入面。`,
  iCap:n=>`有 ${n} 個重組件淨係喺 14 t 塔吊範圍入面，吊唔郁。`,
  iLeft:s=>`仲未擺：${s}。`,
  iIdle:s=>`${s} 一個組件都冇吊到，可唔可以搬去更加有用嘅位置？`,
  next:"去第 2 關",
  saveH:"少用一部 14 t 塔吊，慳到幾多？",
  saveLock:"將 2 部 14 t 塔吊同 1 部 20 t 塔吊擺好，令項目起得成，呢度就會顯示慳到幾多錢。",
  formula:(a,b)=>`慳到 = 安裝及拆卸 ${a} + 租金 ${b} × 月數。`,
  dur:"工期", setup:"安裝及拆卸", rent:"租金", total:"總共慳到",
  m:n=>`${n} 個月`,
  saveNote:"安裝及拆卸費只係慳一次；租金就係工期越長，慳得越多。",
  params:"教師設定：14 t 塔吊成本", pRent:"每月租金（連司機）（港元）", pSetup:"安裝及拆卸費，一次性（港元）",
  pNote:"以上係教學用嘅示意數字，唔係市場報價。改完會即時重新計算。",
  noneLeft:t=>`${t}已經用晒。撳返已經擺咗嘅塔吊可以搬走佢。`,
  site:"地盤界線", core:"核心筒", north:"北翼", south:"南翼", east:"東端",
  plan:"地盤平面圖：組件佈局、塔吊位置同覆蓋範圍"
 }
};
let lang = "en";
try{ const s=localStorage.getItem("mic-lang"); if(s==="zh"||s==="en") lang=s; }catch(e){}
const t = k => T[lang][k];

// ---- Site geometry (same layout as the lecture slide) ----
const SX=[210,293,377,460,543,627,710], HX=[710,818,925];
const ROWS=[[145,173],[195,225],[275,305],[325,355]];
const MODS=[];
ROWS.forEach(([y0,y1])=>{
  for(let i=0;i<6;i++) MODS.push({x0:SX[i],x1:SX[i+1],y0,y1,heavy:false});
  for(let i=0;i<2;i++) MODS.push({x0:HX[i],x1:HX[i+1],y0,y1,heavy:true});
});
const EDGE=[335,502,668,818];
const SLOTS=[...EDGE.map(x=>({x,y:110})),...[293,335,460,585,627,818].map(x=>({x,y:250})),...EDGE.map(x=>({x,y:390}))];
SLOTS.forEach((s,i)=>s.id=String.fromCharCode(65+i));

const TYPES={
  S:{cap:14,r:165,color:"--c14",dash:"7 6"},
  L:{cap:20,r:158,color:"--c20",dash:""}
};
const COST={rent:150000,setup:300000};
const INV={1:{S:3,L:1},2:{S:2,L:1}};

let level=1, sel="S", placed={}, unlocked=false, msg="";

function cranes(){
  return Object.keys(placed).map(Number).sort((a,b)=>SLOTS[a].x-SLOTS[b].x||SLOTS[a].y-SLOTS[b].y)
    .map((si,k)=>({slot:si,type:placed[si],x:SLOTS[si].x,y:SLOTS[si].y,name:"TC"+(k+1),...TYPES[placed[si]]}));
}
function covers(c,m){
  return [[m.x0,m.y0],[m.x1,m.y0],[m.x0,m.y1],[m.x1,m.y1]].every(([x,y])=>Math.hypot(x-c.x,y-c.y)<=c.r+0.5);
}
function analyse(list){
  const st=MODS.map(m=>{
    const cov=list.filter(c=>covers(c,m));
    const elig=cov.filter(c=>c.cap>=(m.heavy?20:14));
    return {m,cov,elig,state:elig.length?"ok":(cov.length&&m.heavy?"cap":"none")};
  });
  const idle=list.filter(c=>!st.some(s=>s.elig.includes(c)));
  return {st,idle,feasible:st.every(s=>s.state==="ok")};
}
const money=n=>"HK$"+Math.round(n).toLocaleString("en-US");
const css=v=>`var(${v})`;

// ---- Plan drawing ----
function drawPlan(A,list){
  const svg=document.getElementById("plan");
  const w=svg.clientWidth||780, k=Math.max(1,Math.min(2,10/(11*w/780)));
  const fs=v=>(v*k).toFixed(1);
  const s=[];
  s.push(`<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--site)"/><line x1="0" y1="0" x2="0" y2="8" stroke="var(--bad)" stroke-width="3"/></pattern></defs>`);
  s.push(`<rect x="87" y="84" width="963" height="332" rx="6" fill="var(--site)" stroke="var(--line-strong)" stroke-dasharray="5 4"/>`);
  s.push(`<rect x="210" y="173" width="715" height="22" fill="var(--band)"/><rect x="210" y="305" width="715" height="20" fill="var(--band)"/>`);
  s.push(`<rect x="210" y="225" width="715" height="50" fill="var(--spine)"/>`);
  const lab=(x,y,key)=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="${fs(10.5)}" font-weight="600" letter-spacing="1" fill="var(--muted)">${t(key)}</text>`;
  s.push(lab(400,184,"north"),lab(818,184,"east"),lab(400,315,"south"),lab(818,315,"east"));
  s.push(`<rect x="210" y="228" width="58" height="44" fill="var(--band)" stroke="var(--line-strong)"/>`);
  s.push(`<text x="239" y="250" text-anchor="middle" dominant-baseline="middle" font-size="${fs(10)}" font-weight="600" fill="var(--ink)">${t("core")}</text>`);
  A.st.forEach(({m,state})=>{
    let fill=m.heavy?"var(--heavy)":"var(--std)", stroke=m.heavy?"var(--heavy-edge)":"var(--std-edge)", sw=1;
    if(list.length&&state==="none"){fill="url(#hatch)";stroke="var(--bad)";sw=2;}
    if(list.length&&state==="cap"){stroke="var(--warn)";sw=3;}
    s.push(`<rect x="${m.x0+.5}" y="${m.y0+.5}" width="${m.x1-m.x0-1}" height="${m.y1-m.y0-1}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
  });
  list.forEach(c=>{
    s.push(`<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="${css(c.color)}" fill-opacity=".09" stroke="${css(c.color)}" stroke-width="2" ${c.dash?`stroke-dasharray="${c.dash}"`:""} pointer-events="none"/>`);
  });
  SLOTS.forEach((sl,i)=>{
    const c=list.find(c=>c.slot===i);
    const below=sl.y<250?-1:1; // edge rows: put letter outward
    const ly=sl.y===250?sl.y+16*k:sl.y+(sl.y<250?-14*k:14*k);
    s.push(`<g data-slot="${i}" tabindex="0" role="button" aria-label="${sl.id}${c?" "+c.name:""}">`);
    s.push(`<circle class="hit" cx="${sl.x}" cy="${sl.y}" r="${Math.min(21,14*k)}" fill="transparent"/>`);
    if(c){
      const q=7*k;
      s.push(`<rect x="${sl.x-q}" y="${sl.y-q}" width="${2*q}" height="${2*q}" rx="2" fill="${css(c.color)}"/>`);
      const pw=36*k, ph=15*k, py=sl.y===250?sl.y-q-ph-2:(sl.y<250?sl.y+q+2:sl.y-q-ph-2);
      s.push(`<rect x="${sl.x-pw/2}" y="${py}" width="${pw}" height="${ph}" rx="${ph/2}" fill="${css(c.color)}"/>`);
      s.push(`<text x="${sl.x}" y="${py+ph/2}" text-anchor="middle" dominant-baseline="central" font-size="${fs(10)}" font-weight="600" fill="var(--surface)">${c.name}</text>`);
    }else{
      s.push(`<circle cx="${sl.x}" cy="${sl.y}" r="${6.5*k}" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>`);
    }
    s.push(`<text x="${sl.x}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="${fs(11)}" font-weight="600" fill="var(--muted)">${sl.id}</text></g>`);
  });
  svg.innerHTML=s.join("");
  svg.setAttribute("aria-label",t("plan"));
}
let lastW=0;
window.addEventListener("resize",()=>{const w=document.getElementById("plan").clientWidth; if(Math.abs(w-lastW)>20){lastW=w; render(true);}});

// ---- Panels ----
function remaining(){
  const r={...INV[level]}; Object.values(placed).forEach(k=>{if(r[k]!=null)r[k]--;}); return r;
}
function drawPalette(){
  const rem=remaining();
  document.getElementById("palette").innerHTML=["S","L"].map(k=>{
    const ty=TYPES[k];
    const icon=`<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="${k==="L"?11.5:10.5}" fill="${css(ty.color)}" fill-opacity=".12" stroke="${css(ty.color)}" stroke-width="1.6" ${ty.dash?'stroke-dasharray="3 2"':""}/><rect x="10.5" y="10.5" width="7" height="7" rx="1" fill="${css(ty.color)}"/></svg>`;
    return `<button class="ctype" data-type="${k}" aria-pressed="${sel===k}">${icon}<span><span class="nm">${t(k)}</span><span class="sub">${t(k+"sub")}</span></span><span class="cnt">${t("left")(rem[k])}</span></button>`;
  }).join("");
}
function savingBlock(A){
  if(!A.feasible) return `<div class="save"><h2>${t("saveH")}</h2><p class="lock">${t("saveLock")}</p></div>`;
  const rows=[1,3,6].map(n=>({n,setup:COST.setup,rent:COST.rent*n,total:COST.setup+COST.rent*n}));
  const max=rows[rows.length-1].total||1;
  let h=`<div class="save"><h2>${t("saveH")}</h2>`;
  h+=`<div class="bars">`+rows.map(r=>`<div class="brow"><span>${t("m")(r.n)}</span><span class="bar"><i style="width:${r.setup/max*100}%;background:var(--line-strong)"></i><i style="width:${r.rent/max*100}%;background:var(--ok)"></i></span><span class="amt">${money(r.total)}</span></div>`).join("")+`</div>`;
  h+=`<div class="keys"><span><i class="sw" style="background:var(--line-strong);border-color:var(--line-strong)"></i>${t("setup")}</span><span><i class="sw" style="background:var(--ok);border-color:var(--ok)"></i>${t("rent")}</span></div>`;
  h+=`<p class="hint">${t("formula")(money(COST.setup),money(COST.rent))} ${t("saveNote")}</p></div>`;
  return h;
}
function drawStatus(A,list){
  const el=document.getElementById("status");
  const nNone=A.st.filter(s=>s.state==="none").length, nCap=A.st.filter(s=>s.state==="cap").length;
  const issues=[];
  if(nNone) issues.push(`<li><span class="tag bad">${nNone}</span>${t("iNone")(nNone)}</li>`);
  if(nCap) issues.push(`<li><span class="tag warn">${nCap}</span>${t("iCap")(nCap)}</li>`);
  const rem=remaining(), left=Object.keys(rem).filter(k=>rem[k]>0).map(k=>`${rem[k]} × ${t(k)}`);
  if(left.length&&!A.feasible) issues.push(`<li><span class="tag info">…</span>${t("iLeft")(left.join(t("sep")))}</li>`);
  if(A.idle.length&&list.length) issues.push(`<li><span class="tag warn">!</span>${t("iIdle")(A.idle.map(c=>c.name).join(t("sep")))}</li>`);
  let h=`<h2>${level===1?t("tab1"):t("tab2")}</h2>`;
  h+=A.feasible?`<div class="verdict ok"><span class="dot"></span><div><b>${t("okTitle")}</b><span>${t("okSub")}</span></div></div>`
               :`<div class="verdict no"><span class="dot"></span><div><b>${t("noTitle")}</b></div></div>`;
  if(issues.length) h+=`<ul class="issues">${issues.join("")}</ul>`;
  if(level===1&&A.feasible) h+=`<button class="primary" id="go2">${t("next")} →</button>`;
  if(level===2) h+=savingBlock(A);
  el.innerHTML=h;
  const g=document.getElementById("go2"); if(g) g.onclick=()=>setLevel(2);
}
function drawParams(){
  const f=(id,lab,val)=>`<label for="${id}">${lab}<input id="${id}" type="number" min="0" step="1000" value="${val}"></label>`;
  document.getElementById("h-params").textContent=t("params");
  document.getElementById("params").innerHTML=`<fieldset><legend>${t("S")}</legend>${f("p-rent",t("pRent"),COST.rent)}${f("p-setup",t("pSetup"),COST.setup)}</fieldset>`;
  document.getElementById("params-note").textContent=t("pNote");
  document.querySelectorAll("#params input").forEach(inp=>inp.onchange=()=>{
    const v=parseFloat(inp.value); if(!(v>=0)){inp.value=COST[inp.id.slice(2)];return;}
    COST[inp.id.slice(2)]=v; render(true);
  });
}
function drawStatic(){
  document.documentElement.lang=t("htmlLang");
  ["eyebrow","h1"].forEach(k=>document.getElementById(k).textContent=t(k));
  document.getElementById("tab1").textContent=t("tab1");
  document.getElementById("tab2").textContent=t("tab2");
  document.getElementById("tab1").setAttribute("aria-selected",level===1);
  document.getElementById("tab2").setAttribute("aria-selected",level===2);
  document.getElementById("tab2").disabled=!unlocked;
  document.getElementById("lang").textContent=t("lang");
  document.getElementById("h-cranes").textContent=t("cranes");
  document.getElementById("hint").textContent=t("hint");
  document.getElementById("clear").textContent=t("clear");
  document.getElementById("params-box").hidden=level!==2;
  document.getElementById("brief").innerHTML= level===1
    ? `<p>${t("b1")}</p><ol><li>${t("r1")}</li><li>${t("r2")}</li><li>${t("r3")}</li></ol>`
    : `<p>${t("b2")}</p><ol><li>${t("r1")}</li><li>${t("r2")}</li><li>${t("r3")}</li><li>${t("r4")}</li></ol>`;
  document.getElementById("legend").innerHTML=
    `<span><i class="sw" style="background:var(--std);border-color:var(--std-edge)"></i>${t("lgStd")}</span>`+
    `<span><i class="sw" style="background:var(--heavy);border-color:var(--heavy-edge)"></i>${t("lgHeavy")}</span>`+
    `<span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--bad) 0 2px,transparent 2px 5px);border-color:var(--bad)"></i>${t("lgNone")}</span>`+
    `<span><i class="sw" style="background:var(--heavy);border:2px solid var(--warn)"></i>${t("lgCap")}</span>`;
}

function render(paramsChanged){
  const list=cranes(), A=analyse(list);
  if(A.feasible&&level===1) unlocked=true;
  drawStatic(); drawPlan(A,list); drawPalette(); drawStatus(A,list);
  if(!paramsChanged) drawParams();
  document.getElementById("toast").textContent=msg;
}

function toggleSlot(i){
  msg="";
  if(placed[i]!=null){ delete placed[i]; }
  else{
    const rem=remaining();
    if(rem[sel]<=0){ const other=Object.keys(rem).find(k=>rem[k]>0); if(other){sel=other;} else {msg=t("noneLeft")(t(sel)); render(true); return;} }
    placed[i]=sel;
    const r2=remaining(); if(r2[sel]<=0){const o=Object.keys(r2).find(k=>r2[k]>0); if(o) sel=o;}
  }
  render(true);
}
function setLevel(n){
  if(n===2&&!unlocked) return;
  level=n; placed={}; msg=""; sel="S"; render();
  window.scrollTo({top:0,behavior:"smooth"});
}

const svg=document.getElementById("plan");
svg.addEventListener("click",e=>{const g=e.target.closest("[data-slot]"); if(g) toggleSlot(+g.dataset.slot);});
svg.addEventListener("keydown",e=>{
  const g=e.target.closest("[data-slot]"); if(!g) return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault(); const i=+g.dataset.slot; toggleSlot(i); const n=document.querySelector(`[data-slot="${i}"]`); if(n) n.focus();}
});
document.getElementById("palette").addEventListener("click",e=>{const b=e.target.closest("[data-type]"); if(b){sel=b.dataset.type; msg=""; render(true);}});
document.getElementById("clear").onclick=()=>{placed={}; msg=""; render(true);};
document.getElementById("tab1").onclick=()=>setLevel(1);
document.getElementById("tab2").onclick=()=>setLevel(2);
document.getElementById("lang").onclick=()=>{lang=lang==="en"?"zh":"en"; try{localStorage.setItem("mic-lang",lang);}catch(e){} render();};

render();
})();
</script>
